<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1ECE2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2B3527" media="(prefers-color-scheme: dark)">
<meta name="description" content="Reserva tus clases de pilates en Alento.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alento">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Alento Reservas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: app de socio con cabecera fija, pestañas y vistas en una columna (horario + panel lateral en escritorio).
   Marca Alento: arena/crema 60 % fondos, bosque 30 % marca y texto, arcilla 10 % solo acentos, salvia apoyo puntual. */
:root{
  --bosque:#3E4C38; --arena:#D8C8AC; --crema:#F1ECE2; --arcilla:#B5714F; --salvia:#7A8C67;
  --bg:#F1ECE2; --surface:#FAF7F1; --surface-2:#E6DCC9; --ink:#3E4C38; --ink-2:#66705E; --line:#DDD3C0;
  --brand:#3E4C38; --on-brand:#F1ECE2; --accent:#B5714F; --accent-soft:#F0DDD1;
  --ok:#557A4C; --ok-soft:#DFE7D6; --warn:#A06A1E; --warn-soft:#F2E3C7; --full:#9C4A36; --full-soft:#F2D9D0;
  --t-ref:#D8C8AC; --t-mat:#C9D3BC; --t-bar:#EBCDBB; --t-pre:#E6DCC9; --t-str:#D5DCCB;
  --shadow:0 1px 2px rgba(62,76,56,.06),0 6px 20px rgba(62,76,56,.06);
  --font:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2B3527; --surface:#35412F; --surface-2:#425039; --ink:#F1ECE2; --ink-2:#C4BCA9; --line:#4C5A44;
  --brand:#F1ECE2; --on-brand:#3E4C38; --accent:#D08A66; --accent-soft:#5A4636;
  --ok:#A8C79A; --ok-soft:#3F5237; --warn:#E3B66E; --warn-soft:#57492F; --full:#E59A85; --full-soft:#5A3D35;
  --t-ref:#5B5544; --t-mat:#4D5C43; --t-bar:#5E4A3D; --t-pre:#4E4A3E; --t-str:#46543F;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 6px 20px rgba(0,0,0,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2B3527; --surface:#35412F; --surface-2:#425039; --ink:#F1ECE2; --ink-2:#C4BCA9; --line:#4C5A44;
  --brand:#F1ECE2; --on-brand:#3E4C38; --accent:#D08A66; --accent-soft:#5A4636;
  --ok:#A8C79A; --ok-soft:#3F5237; --warn:#E3B66E; --warn-soft:#57492F; --full:#E59A85; --full-soft:#5A3D35;
  --t-ref:#5B5544; --t-mat:#4D5C43; --t-bar:#5E4A3D; --t-pre:#4E4A3E; --t-str:#46543F;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 6px 20px rgba(0,0,0,.18); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-weight:500;line-height:1.2;text-wrap:balance;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.desc{font-size:11.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* cabecera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{width:124px;height:auto;color:var(--brand);display:block;flex:none}
.bar .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:500;border:0;white-space:nowrap}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.who{display:flex;align-items:center;gap:6px;font-size:12px}
.who select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:13px;max-width:150px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;width:fit-content;max-width:100%;margin:0 auto 12px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 4px 14px rgba(62,76,56,.06)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;font-weight:500;font-size:14px;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.tab svg{width:17px;height:17px;flex:none}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--brand);color:var(--on-brand)}
.tab[aria-selected="true"] .tab-badge{background:var(--on-brand);color:var(--brand)}
header.top .bar{position:relative}
@media (max-width:560px){.logo{width:120px}.credit-label{display:none}}

main{padding-block:24px 64px}
.view-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}
.view-head h1{font-size:clamp(24px,4vw,32px)}
.view-head p{margin:4px 0 0}

/* horario */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.day{flex:none;width:62px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;text-align:center;line-height:1.25}
.day b{display:block;font-size:20px;font-weight:500}
.day small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.day[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.day[aria-pressed="true"] small{color:inherit;opacity:.8}
.day .dot{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:var(--accent)}
.day .dot.off{visibility:hidden}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
@media (max-width:560px){.filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.filters::-webkit-scrollbar{display:none}.filters .chip{flex:none;padding:6px 10px;font-size:12.5px}}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.cls{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cls.past{opacity:.55}
.cls .time b{display:block;font-size:20px;font-weight:500;line-height:1.1}
.cls .time small{color:var(--ink-2);font-size:12px}
.type{display:inline-block;padding:3px 9px;border-radius:6px;color:var(--ink)}
.t-ref{background:var(--t-ref)}.t-mat{background:var(--t-mat)}.t-bar{background:var(--t-bar)}.t-pre{background:var(--t-pre)}.t-str{background:var(--t-str)}
.cls h3{font-size:16px;margin:8px 0 2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-2)}
.inst{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.av{width:22px;height:22px;border-radius:50%;background:var(--salvia);color:#F1ECE2;font-size:10px;font-weight:600;display:inline-grid;place-items:center}
.cap{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:170px}
.seats{display:flex;gap:4px}
.seat{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink-2);opacity:.6}
.seat.on{background:var(--ink);border-color:var(--ink);opacity:1}
.seat.me{background:var(--accent);border-color:var(--accent);opacity:1}
.cap-text{font-size:12.5px;color:var(--ink-2);text-align:right}
.cap-text.full{color:var(--full);font-weight:500}
.cap-text.low{color:var(--warn);font-weight:500}
.btn{border:1px solid transparent;border-radius:999px;padding:9px 18px;font-weight:500;font-size:14px;background:var(--brand);color:var(--on-brand);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.accent{background:var(--accent);color:#fff}
.btn.wait{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.sm{padding:6px 14px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.wait{background:var(--warn-soft);color:var(--warn)}
.status.full{background:var(--full-soft);color:var(--full)}
@media (max-width:620px){
  .cls{grid-template-columns:56px minmax(0,1fr);gap:12px}
  .cap{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;min-width:0;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
  .cap-text{text-align:left}
}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:130px}
@media (max-width:880px){.side{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h2{font-size:16px;margin-bottom:10px}
.balance{background:var(--brand);color:var(--on-brand);border:0}
.balance .big{font-size:40px;font-weight:500;line-height:1}
.balance .btn{background:var(--on-brand);color:var(--brand);margin-top:14px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.rules .n{width:22px;height:22px;border-radius:50%;background:var(--surface-2);font-size:11px;font-weight:600;display:grid;place-items:center}
.empty{text-align:center;padding:40px 16px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty svg{width:44px;height:44px;color:var(--salvia);margin-bottom:8px}

/* mis reservas */
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.res .when{font-size:13px;color:var(--ink-2)}
.res h3{font-size:16px;margin:2px 0}
.section-t{font-size:13px;margin:24px 0 10px;color:var(--ink-2)}

/* pagos */
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:880px){.plans{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.plans{grid-template-columns:minmax(0,1fr)}}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;position:relative}
.plan.pop{border-color:var(--accent)}
.plan .tag{position:absolute;top:-10px;left:16px;background:var(--accent);color:#fff;font-size:10.5px;padding:2px 8px;border-radius:6px}
.plan .price{font-size:28px;font-weight:500;line-height:1.1}
.plan .per{font-size:12.5px;color:var(--ink-2)}
.plan .btn{margin-top:auto}
.plan ul{margin:6px 0 12px;padding-left:18px;font-size:13px;color:var(--ink-2)}
.plan .was{font-size:15px;color:var(--ink-2);font-weight:400}.plan .left{color:var(--accent);font-weight:500}
.promo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}.promo input{flex:1 1 200px;min-width:0;max-width:320px;text-transform:uppercase}
.alert.opening{margin:0 0 14px}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.cal-hd b{font-size:15px}
.cal-nav{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;color:var(--ink)}.cal-nav:disabled{opacity:.35}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal-g small{font-size:11px;color:var(--ink-2);font-weight:600;padding:2px 0}
.cal-d{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:13.5px;border:0;background:var(--surface-2);color:var(--ink);font-variant-numeric:tabular-nums}
button.cal-d:hover{outline:1.5px solid var(--brand)}.cal-d.on{background:var(--brand);color:var(--on-brand)}.cal-d.today:not(.on){outline:1.5px solid var(--accent)}
.cal-d.off{background:none;color:var(--ink-2);opacity:.45}.cal-d.later{opacity:.7;text-decoration:underline dotted;text-underline-offset:3px}
.cal-d i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}.cal-d.on i{background:var(--on-brand)}
.cal-note{font-size:12px;margin:10px 0 0}
.cal-btn{display:none;align-items:center;gap:6px}.cal-btn svg{width:16px;height:16px}
@media (max-width:880px){.cal-panel{display:none}.cal-btn{display:inline-flex}}
.info{max-width:960px;margin:0 auto}.info-hero{text-align:center;padding:18px 0 6px}.info-hero h1{margin:8px 0 6px}.info-hero .iso-big{width:44px;height:auto;color:var(--ink)}
.info-open{font-weight:600;color:var(--ink);margin:6px 0}.info-trial{display:inline-block;background:var(--surface-2);border-radius:999px;padding:6px 14px;margin:6px 0;font-size:14px}
.info-week{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.info-day h3{margin:0 0 8px;font-size:15px}.info-day ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.info-day li{display:flex;gap:10px;font-size:14px}.info-day li b{min-width:44px}.info-day li span{display:flex;flex-direction:column;min-width:0}.info-day li small{font-size:12px}
.info-plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.info-plan{position:relative}.info-plan ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.info-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.info-types .panel{display:flex;flex-direction:column;gap:2px}.info-types p{margin:6px 0 0;font-size:13.5px;color:var(--ink-2)}
.info-contact{display:flex;flex-direction:column;gap:10px}.info-contact a{color:var(--ink)}
.aj-sticker{display:flex;gap:16px;align-items:center;margin-top:14px;flex-wrap:wrap}.aj-qr{width:128px;flex:none}.aj-qr svg{width:100%;height:auto;display:block;border-radius:8px}
.docfolder{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--bg)}
.doclist{list-style:none;margin:8px 0 0;padding:0}.doclist li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.doclist .dn{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.clock-panel h2{margin:4px 0 0}.clock-panel .actions .btn{min-width:150px}
.clock-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}.clock-tools .field{margin:0;min-width:0;flex:0 1 220px}
.clock-board{table-layout:fixed;width:100%;min-width:0;border-collapse:collapse;font-size:12.5px}.clock-board th,.clock-board td{padding:6px 3px;text-align:center;vertical-align:top;border-bottom:1px solid var(--line)}
.clock-board thead th:first-child,.clock-board tbody th{width:52px;text-align:left;font-weight:500;color:var(--ink-2);white-space:nowrap}
.clock-board td div{line-height:1.35}.clock-board td b{display:block;margin-top:2px}.clock-board .cb-empty{color:var(--ink-3,#bbb)}.clock-board .status{font-size:10.5px;padding:1px 5px}
.cb-who{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.clock-board thead small{display:block;color:var(--ink-2);font-weight:400;white-space:nowrap;font-size:11px}.clock-board thead th{text-transform:none;letter-spacing:0;font-size:13px}
.cb-dot{width:8px;height:8px;border-radius:50%;background:#c9c4bb;flex:none}.cb-dot.ok{background:#3f9b6b}.cb-dot.wait{background:#d49a2a}
.clock-totals{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.clock-table a{font-size:12px;color:var(--ink-2)}
.aj-sec{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}.aj-sec > p.muted{font-size:13px;margin:4px 0 0}
.aj-card{border:1px solid var(--line);border-radius:12px;padding:4px 14px 14px;margin-top:12px;background:var(--bg)}
.aj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0 12px}.aj-grid .wide{grid-column:1/-1}
.aj-grid input,.aj-grid select{min-width:0;width:100%;box-sizing:border-box}
.aj-row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.aj-checks{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px}.aj-checks label{display:flex;gap:6px;align-items:center}
.aj-staff{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.aj-staff .chip{display:inline-flex;gap:6px;align-items:center}.aj-staff .chip button{border:0;background:none;padding:0 2px;font-size:15px;line-height:1;color:var(--ink-2)}
.aj-days{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.aj-days [aria-pressed="true"] small{color:inherit;opacity:.75}
.aj-class{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,70px) auto;gap:8px;align-items:end;margin-top:8px}
.aj-class input,.aj-class select{min-width:0;width:100%;box-sizing:border-box}.aj-class .field{margin-top:0}
@media (max-width:640px){.aj-class{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:10px 0;border-bottom:1px solid var(--line)}.aj-class > button{grid-column:1/-1;justify-self:start}}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--ink-2);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}

/* tienda */
.shop{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:880px){.shop{grid-template-columns:minmax(0,1fr)}}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.art{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;position:relative}
.art.v-p{background:#D8C8AC;color:#3E4C38}
.art.v-i{background:#3E4C38;color:#F1ECE2}
.art svg.piece{width:58%;height:auto}

function genClasses(){

  const open = OPEN ? new Date(OPEN + 'T00:00:00') : today, start = open > today ? open : today;
  const classes = [];
  for (let i = 0; i < DAYS_AHEAD; i++){
    const d = new Date(start); d.setDate(d.getDate() + i);
    (WEEK[d.getDay()] || []).forEach(([time,type,instr,level,rcap], j) => {
      const cap = rcap || (TYPES[type] && TYPES[type].cap) || CAP;
      const n = Math.min(cap, Math.round([3,8,5,7,8,2,6,4,8,1,5][(i*3 + j*5) % 11] * cap / 8));
      const c = { id:`${ymd(d)}-${time}-${j}`, date:ymd(d), time, type, instr, level, cap, booked:fill(n), wait:[] };
      if (n === cap) c.wait = fill(Math.min(WAIT_MAX, (i + j) % 3));

// Envía al servidor lo que ha cambiado en S desde la última vez (mensajes, avisos, fichas, lecturas…).
function sync(){ L.chain = L.chain.then(pushChanges, pushChanges); return L.chain; }
async function pushChanges(){
  if (!LIVE || !L.pid) return;
  const adm = isAdmin(), P = {}, fresh = arr => arr.filter(x => !x._db && !x._q);
  const nm = fresh(S.msgs), nn = fresh(S.notifs), np = fresh(S.payments), na = fresh(S.accessLog), att = L.attended.slice();
  if (nm.length) P.msgs = nm.map(m => ({ thread:m.thread, from_center:m.from === 'centro', text:m.text, kind:m.kind || 'chat', cat:m.cat || null }));
  if (nn.length) P.notifs = nn.map(n => ({ uid:n.uid === ADMIN ? 'admin' : n.uid, text:n.text }));
  if (np.length) P.payments = np.map(y => ({ concept:y.concept, amount:y.amount, method:y.method }));
  if (na.length) P.access = na.map(a => ({ uid:a.uid || '', ok:!!a.ok, title:a.title, manual:!!a.manual }));
  if (att.length) P.attended = att;
  const rm = S.msgs.filter(m => m._db && m.read && !m._r), rn = S.notifs.filter(n => n._db && n.read && !n._r);
  if (rm.length) P.read_msgs = rm.map(m => m._db);
  if (rn.length) P.read_notifs = rn.map(n => n._db);
  const fichas = {};
  Object.entries(S.clients).forEach(([id, f]) => { if (!adm && id !== L.pid) return; const j = JSON.stringify(wireFicha(f)); if (j !== L.snap.fichas[id]) fichas[id] = j; });
  if (Object.keys(fichas).length) P.fichas = Object.fromEntries(Object.entries(fichas).map(([id, j]) => [id, JSON.parse(j)]));
  const wj = JSON.stringify(S.wallet[L.pid] || null), sj = JSON.stringify(S.subs[L.pid] || null);
  if (!adm && wj !== L.snap.wallet) P.wallet = S.wallet[L.pid];
  if (!adm && sj !== L.snap.subs) P.subs = S.subs[L.pid] || null;
  if (!Object.keys(P).length) return;
  const queued = [...nm, ...nn, ...np, ...na]; queued.forEach(x => x._q = true);
  try {
    const r = await rpc('push', { p:P });
    nm.forEach((m, i) => m._db = r.msgs[i]); nn.forEach((n, i) => n._db = r.notifs[i]); np.forEach((y, i) => y._db = r.payments[i]); na.forEach((a, i) => a._db = r.access[i]);
    rm.forEach(m => m._r = true); rn.forEach(n => n._r = true);
    Object.assign(L.snap.fichas, fichas);
    if (P.wallet !== undefined) L.snap.wallet = wj;
    if ('subs' in P) L.snap.subs = sj;
    L.attended.splice(0, att.length);
  } catch(e){ queued.forEach(x => delete x._q); toast(errText(e)); }
}

async function refresh(quiet){
  if (!LIVE) return;
  if (quiet && (layer.innerHTML || isTyping() || L.op)) return;
  await sync();
  let h;
  try { h = await rpc('hydrate'); }
  catch(e){ if (!quiet) toast(errText(e)); if (L.loading){ L.loading = false; render(); } return; }
  if (!h || !h.profile){
    L.loading = false; await sb.auth.signOut();
    toGuest(); toast('Esta cuenta no está dada de alta en el centro. Escribe a recepción.'); return;
  }
  const json = JSON.stringify({ ...h, rev:0 });
  if (quiet && (json === L.last || layer.innerHTML || isTyping() || L.op)){ if (json === L.last){ L.rev = h.rev; L.full = Date.now(); } return; }
  L.last = json;
  applyHydrate(h);
  if (L.need.length) loadMedia(L.need);
  if (h.profile.role === 'admin' && !Object.keys(h.center.week || {}).length){
    // Primera vez que entra recepción: se sube la plantilla semanal y se crean las clases de los próximos 28 días.
    try { await rpc('save_config', { p_name:S.cfg.name, p_cfg:cfgPayload(), p_week:weekPayload() }); L.last = ''; return refresh(); }
    catch(e){ toast(errText(e)); }
  }
  if (h.profile.role !== 'admin') applyPendingSignup();
  L.loading = false;
  render();
}

// ---------- lógica de reservas ----------
function book(c){
  if (hoursTo(c) <= 0) return;
  if (S.credits[me()] < 1) return needCredits();
  if (LIVE) return liveOp(() => rpc('book_class', { p_class:c.id }), r => r === 'booked' ? `Reserva confirmada: ${c.type}, ${c.time}` : `Estás en lista de espera (${r.split(':')[1]}.º). Te avisamos si queda plaza.`);
  if (c.booked.length < capOf(c)){
    c.booked.push(me()); S.credits[me()]--;
    toast(`Reserva confirmada: ${c.type}, ${c.time}`);
  } else if (c.wait.length < WAIT_MAX){
    c.wait.push(me());
    toast(`Estás en lista de espera (${c.wait.length}.º). Te avisamos si queda plaza.`);
  } else return toast('Completo y con la lista de espera llena.');
  save(); render();
}
function promote(c){
  while (c.booked.length < capOf(c) && c.wait.length){
    const uid = c.wait.shift();
    if (!SOCIOS[uid]){ c.booked.push(uid); continue; }
    if (S.credits[uid] >= 1){
      S.credits[uid]--; c.booked.push(uid);
      notify(uid, `Se ha liberado una plaza y ya la tienes: ${c.type} con ${INSTR[c.instr].name}, ${fmtDay(c.date)} a las ${c.time}. Se ha descontado 1 ${SEC.unit} de tu bono.`);
    } else {
      notify(uid, `Se liberó una plaza en ${c.type} (${fmtDay(c.date,{weekday:'long',day:'numeric'})}, ${c.time}), pero no te quedaban ${SEC.units} en el bono y pasó a la siguiente persona.`);
    }
  }
  c.wait.forEach((uid,i) => { if (SOCIOS[uid]) notify(uid, `Subes al puesto ${i+1}.º de la lista de espera de ${c.type} (${c.time}).`); });
}
function cancel(c){
  if (LIVE) return liveOp(() => rpc('cancel_booking', { p_class:c.id }), r => r.refund ? `Reserva cancelada. Te devolvemos la ${SEC.unit} al bono.` : `Reserva cancelada. Fuera de plazo: la ${SEC.unit} no se devuelve.`);
  const refund = hoursTo(c) >= CANCEL_H;
  c.booked = c.booked.filter(u => u !== me());
  if (refund) S.credits[me()]++;
  promote(c);
  save(); render();
  toast(refund ? `Reserva cancelada. Te devolvemos la ${SEC.unit} al bono.` : `Reserva cancelada. Fuera de plazo: la ${SEC.unit} no se devuelve.`);
}
function leaveWait(c){
  if (LIVE) return liveOp(() => rpc('cancel_booking', { p_class:c.id }), () => 'Has salido de la lista de espera.');
  c.wait = c.wait.filter(u => u !== me());
  save(); render(); toast('Has salido de la lista de espera.');
}

// Calendario del mes para saltar a un día concreto. Solo se pueden elegir días con clases ya abiertas a reserva.
let calMonth = '';
function calendarHTML(days){
  const today = ymd(new Date()), set = new Set(days), last = days[days.length - 1] || today;
  if (!calMonth) calMonth = (S.day || today).slice(0, 7);
  const minM = today.slice(0, 7), maxM = (last > today ? last : today).slice(0, 7);
  if (calMonth < minM) calMonth = minM; if (calMonth > maxM) calMonth = maxM;
  const [y, m] = calMonth.split('-').map(Number), first = new Date(y, m - 1, 1), n = new Date(y, m, 0).getDate(), lead = (first.getDay() + 6) % 7;
  const mine = d => S.classes.some(c => c.date === d && (c.booked.includes(me()) || c.wait.includes(me())));
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span></span>';
  for (let d = 1; d <= n; d++){
    const ds = `${y}-${pad(m)}-${pad(d)}`, open = set.has(ds), later = !open && ds > last && (WEEK[new Date(ds + 'T12:00:00').getDay()] || []).length;
    cells += open ? `<button type="button" class="cal-d ${ds === S.day ? 'on' : ''} ${ds === today ? 'today' : ''}" data-calday="${ds}">${d}${mine(ds) ? '<i></i>' : ''}</button>`
      : `<span class="cal-d off ${later ? 'later' : ''}" ${later ? `title="Se abre a reserva ${DAYS_AHEAD} días antes"` : ''}>${d}</span>`;
  }
  const label = first.toLocaleDateString('es-ES', { month:'long', year:'numeric' });
  return `<div class="cal"><div class="cal-hd"><button type="button" class="cal-nav" data-calm="-1" ${calMonth <= minM ? 'disabled' : ''} aria-label="Mes anterior">‹</button><b>${cap1(label)}</b><button type="button" class="cal-nav" data-calm="1" ${calMonth >= maxM ? 'disabled' : ''} aria-label="Mes siguiente">›</button></div>
    <div class="cal-g">${['L','M','X','J','V','S','D'].map(x => `<small>${x}</small>`).join('')}${cells}</div>
    <p class="muted cal-note">Puedes reservar hasta ${DAYS_AHEAD} días antes.${S.classes.some(c => c.booked.includes(me())) && !isAdmin() ? ' El punto marca tus reservas.' : ''}</p></div>`;
}
function bindCalendar(box, pick){

// Métodos guardados por cliente (en producción los guarda la pasarela; aquí solo los últimos dígitos)
const walletOf = uid => (S.wallet[uid] = S.wallet[uid] || { cards:[], iban:null });
const isApple = /iPhone|iPad|Macintosh/.test(navigator.userAgent);
const WALLET = isApple ? 'Apple Pay' : 'Google Pay';
function validIban(v){
  const s = v.toUpperCase().replace(/\s/g,'');
  if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s)) return false;
  const r = (s.slice(4) + s.slice(0,4)).replace(/[A-Z]/g, ch => ch.charCodeAt(0) - 55);
  let mod = 0; for (const d of r) mod = (mod * 10 + +d) % 97;
  return mod === 1;
}
const brandOf = n => /^4/.test(n) ? 'Visa' : /^(5[1-5]|2[2-7])/.test(n) ? 'Mastercard' : /^3[47]/.test(n) ? 'Amex' : 'Tarjeta';
const nextMonth = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime(); };
function checkout({ title, lines, total, onPaid, allowDesk, recurring }){

    { id:'wallet', label:WALLET, sub:'Pago en un toque con el móvil' },

    ...(recurring ? [{ id:'sepa', label:'Domiciliación bancaria', sub: w.iban ? `Cuenta ···· ${w.iban.slice(-4)}` : 'Cargo mensual en tu cuenta (SEPA)' }] : [{ id:'bizum', label:'Bizum', sub:'Con tu número de móvil' }]),

    <form id="payForm" novalidate>
      <div class="paylist" role="radiogroup" aria-label="Método de pago">${opts.map(o => `<label class="payopt"><input type="radio" name="pm" value="${o.id}" ${o.id === method ? 'checked' : ''}><span class="pm-ic pm-${o.id.replace(/\d+$/,'')}" aria-hidden="true"></span><span><b>${o.label}</b><small>${o.sub}</small></span></label>`).join('')}</div>
      <div id="mCard" hidden>
        <label class="field">Número de tarjeta<input id="cc" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242" value="5555 5555 5555 4444"></label>
        <div class="row2"><label class="field">Caducidad<input id="exp" placeholder="MM/AA" value="09/29" autocomplete="cc-exp"></label><label class="field">CVC<input id="cvc" inputmode="numeric" placeholder="123" value="123" autocomplete="cc-csc"></label></div>
        <label class="check" style="margin-top:10px"><input type="checkbox" id="saveCard" checked><span>Guardar la tarjeta para próximos pagos</span></label>
      </div>
      <div id="mBizum" hidden><label class="field">Teléfono Bizum<input id="tel" inputmode="tel" placeholder="600 000 000" value="${esc((S.clients[me()] || {}).tel || '')}"></label></div>
      <div id="mSepa" hidden>${w.iban ? '' : `<label class="field">IBAN<input id="iban" placeholder="ES91 2100 0418 4502 0005 1332" value="ES91 2100 0418 4502 0005 1332" autocapitalize="characters"></label>`}
        <label class="check" style="margin-top:10px"><input type="checkbox" id="mandate"><span>Autorizo a ${esc(S.cfg.name)} a cargar en mi cuenta la cuota mensual (orden de domiciliación SEPA). Puedo cancelarla cuando quiera.</span></label></div>
      <div class="err" id="payErr" role="alert"></div>
      <p class="muted" style="font-size:12px;margin-top:12px">${LIVE ? 'Pago de prueba: no se cobra nada y las clases se suman al bono.' : 'Pago simulado para la demo. No se realiza ningún cargo.'}</p>
      <div class="actions"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn" type="submit" id="payBtn">Pagar ${eur(total)}</button></div>
    </form>`, m => {
    const sync = () => {
      m.querySelector('#mCard').hidden = method !== 'card';
      m.querySelector('#mBizum').hidden = method !== 'bizum';
      m.querySelector('#mSepa').hidden = method !== 'sepa';
      m.querySelector('#payBtn').textContent = method === 'wallet' ? `Pagar con ${WALLET}` : method === 'desk' ? 'Confirmar pedido' : method === 'sepa' ? 'Domiciliar cuota' : `Pagar ${eur(total)}`;
    };
    m.querySelectorAll('[name="pm"]').forEach(r => r.onchange = () => { method = r.value; m.querySelector('#payErr').textContent = ''; sync(); });
    sync();
    m.querySelector('#payForm').onsubmit = e => {

        if (!/^\d{3,4}$/.test(m.querySelector('#cvc').value.trim())) return err.textContent = 'El CVC tiene 3 o 4 dígitos.';

      } else if (method === 'bizum'){
        if (m.querySelector('#tel').value.replace(/\D/g,'').length !== 9) return err.textContent = 'El teléfono debe tener 9 dígitos.';
        label = 'Bizum';

        const ib = m.querySelector('#iban');
        if (ib && !validIban(ib.value)) return err.textContent = 'El IBAN no es válido. Revisa los dígitos.';
        if (!m.querySelector('#mandate').checked) return err.textContent = 'Marca la autorización de domiciliación para continuar.';
        if (ib) w.iban = ib.value.toUpperCase().replace(/\s/g,'');
        label = `Domiciliación ···· ${w.iban.slice(-4)}`;
      } else label = 'En recepción (pendiente)';
      const btn = m.querySelector('#payBtn'); btn.disabled = true; btn.textContent = 'Procesando…';
      setTimeout(() => { closeLayer(); onPaid(label); }, method === 'wallet' ? 700 : 400);
    };
  });
}

function afterPagos(root){

    const p = plans().find(x => x.id === b.dataset.plan), code = PROMO.pct ? PROMO.code : null;

    if (code) lines.push([`Código ${code} (−${PROMO.pct} %)${p.recurring ? ', primer mes' : ''}`, amount - p.price]);
    checkout({ title: p.recurring ? `Suscribirme a ${p.name}` : `Comprar ${p.name}`, lines, total:amount, recurring:!!p.recurring,
      onPaid: method => {
        if (LIVE) return liveOp(() => rpc('buy_plan', { p_plan:p.id, p_method:method, p_code:code }), n => { PROMO = {}; return `Listo. Tienes ${n} ${U(n)} en tu bono.`; });
        S.credits[me()] += p.classes; PROMO = {};
        S.payments.push({ uid:me(), ts:Date.now(), concept: (p.recurring ? `${p.name} (primer mes)` : p.name) + (code ? ` · código ${code}` : ''), amount, method, planId:p.id });
        if (p.recurring) S.subs[me()] = { plan:p.id, since:Date.now(), next:nextMonth(), method };
        notify(me(), `Pago recibido: ${p.name} (${eur(amount)}). Se han añadido ${p.classes} ${U(p.classes)} a tu bono.`);
        save(); render(); toast(`Listo. Tienes ${S.credits[me()]} ${U(S.credits[me()])} en tu bono.`);
      }});
  });
  const pf = root.querySelector('#promoForm');
  if (pf) pf.onsubmit = async e => {

  };
  const po = root.querySelector('#promoOff'); if (po) po.onclick = () => { PROMO = {}; render(); };
  root.querySelectorAll('[data-delcard]').forEach(b => b.onclick = () => { w.cards.splice(+b.dataset.delcard, 1); save(); render(); toast('Tarjeta eliminada.'); });
  const di = root.querySelector('#delIban'); if (di) di.onclick = () => { w.iban = null; save(); render(); toast('Cuenta eliminada.'); };
  root.querySelector('#addCard').onclick = () => modal(`<h2>Añadir tarjeta</h2>
    <label class="field">Número de tarjeta<input id="nc" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242"></label>
    <div class="row2"><label class="field">Caducidad<input id="ne" placeholder="MM/AA" autocomplete="cc-exp"></label><label class="field">CVC<input id="nv" inputmode="numeric" placeholder="123" autocomplete="cc-csc"></label></div>
    <div class="err" id="nerr" role="alert"></div>
    <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="nok">Guardar tarjeta</button></div>`, m => m.querySelector('#nok').onclick = () => {
      const cc = m.querySelector('#nc').value.replace(/\D/g,''), exp = m.querySelector('#ne').value.trim(), err = m.querySelector('#nerr');
      if (cc.length < 15 || cc.length > 16) return err.textContent = 'El número de tarjeta no es válido.';
      if (!/^\d{2}\/\d{2}$/.test(exp)) return err.textContent = 'Escribe la caducidad como MM/AA.';
      if (!/^\d{3,4}$/.test(m.querySelector('#nv').value.trim())) return err.textContent = 'El CVC tiene 3 o 4 dígitos.';
      w.cards.push({ brand:brandOf(cc), last4:cc.slice(-4), exp }); closeLayer(); save(); render(); toast('Tarjeta guardada.');
    });
  const sc = root.querySelector('#subCancel'); if (sc) sc.onclick = () => modal(`<h2>¿Cancelar la renovación?</h2><p class="muted">Tu cuota sigue activa hasta el ${fmtDate(S.subs[me()].next)} y después no se vuelve a cobrar.</p>
    <div class="actions"><button class="btn ghost" data-close>Mantener</button><button class="btn accent" id="m_sc">Cancelar renovación</button></div>`, m => m.querySelector('#m_sc').onclick = () => { S.subs[me()].cancelled = true; notify(ADMIN, `${SOCIOS[me()]} ha cancelado la renovación de su cuota.`); closeLayer(); save(); render(); toast('Renovación cancelada.'); });

function chatBox(thread, viewer, draftKey, placeholder){

const DNI_L = 'TRWAGMYFPDXBNJZSQVHLCKE';
function validDni(v){
  v = v.toUpperCase().replace(/[\s-]/g,'');
  const m = v.match(/^([XYZ]?)(\d{7,8})([A-Z])$/); if (!m) return false;
  const num = m[1] ? '' + 'XYZ'.indexOf(m[1]) + m[2] : m[2];
  return (m[1] ? m[2].length === 7 : m[2].length === 8) && DNI_L[+num % 23] === m[3];
}
const age = nac => { if (!nac) return null; const b = new Date(nac+'T12:00:00'), n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a; };
const fmtDate = ts => new Date(ts).toLocaleDateString('es-ES',{ day:'numeric', month:'short', year:'numeric' });
const kb = n => n > 1e6 ? (n/1e6).toFixed(1).replace('.',',') + ' MB' : Math.round(n/1e3) + ' KB';
function missing(c){
  const out = DOCS.filter(d => d.req && !(c.docs[d.id] && c.docs[d.id].ok)).map(d => d.title);
  if (!c.firma) out.push('Firma del cliente');

  if (age(c.nac) !== null && age(c.nac) < 18 && !(c.tutor && c.tutor.nombre)) out.push('Autorización del tutor legal');

}

const initials = c => ((c.nombre || '?')[0] + ((c.apellidos || '')[0] || '')).toUpperCase();
const avatar = (c, cls = '') => `<span class="av ${cls}">${c && c.foto && c.foto[0] !== '@' ? `<img src="${c.foto}" alt="">` : esc(c ? initials(c) : '?')}</span>`;
// Reduce la foto a un cuadrado de 192 px para que ocupe poco (unos 15 KB).
function photoFrom(file){
  return new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const n = 192, cv = document.createElement('canvas'), side = Math.min(img.width, img.height);
      cv.width = cv.height = n;
      cv.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, n, n);
      URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(); };
    img.src = url;
  });
}
const hasHealth = c => c.salud && (c.salud.lesiones || c.salud.patologias || c.salud.medicacion || (c.salud.embarazo && c.salud.embarazo !== 'No'));

// Firma manuscrita en un canvas (ratón, dedo o lápiz)
function mountSig(canvas, onChange){
  const ratio = window.devicePixelRatio || 1, ctx = canvas.getContext('2d');
  const size = () => { const r = canvas.getBoundingClientRect(); canvas.width = r.width * ratio; canvas.height = r.height * ratio; ctx.scale(ratio, ratio); ctx.lineWidth = 2.2; ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = '#3E4C38'; };
  size();
  let drawing = false, dirty = false, last;
  const pos = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  canvas.addEventListener('pointerdown', e => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0], last[1], 1, 0, 7); ctx.fillStyle = '#3E4C38'; ctx.fill(); });
  canvas.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; dirty = true; });
  const end = () => { if (!drawing) return; drawing = false; if (dirty) onChange(canvas.toDataURL('image/png')); };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  return () => { ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); size(); dirty = false; onChange(null); };
}
const sigBox = id => `<div class="sigwrap"><canvas class="sig" id="${id}" aria-label="Zona de firma"></canvas><span class="sig-hint">Firma aquí con el dedo o el ratón</span></div><button type="button" class="linkbtn" id="${id}Clear" style="margin-top:6px">Borrar firma</button>`;

function validateStep(){
  const r = reg, d = r.d;

    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) return 'El email no es válido.';
    if (Object.values(S.clients).some(c => !c.baja && (c.email || '').toLowerCase() === d.email.toLowerCase())) return 'Ya hay una cuenta con ese email. Entra con ella desde «Entrar».';
    if (!r.byAdmin && d.pass.length < 8) return 'La contraseña debe tener al menos 8 caracteres.';
    if (!d.en.trim() || d.et.replace(/\D/g,'').length < 9) return 'Añade un contacto de emergencia con nombre y teléfono.';
    if (age(d.nac) < 18 && (!d.tn.trim() || !validDni(d.td))) return 'Al ser menor de edad, añade el nombre y un DNI válido del tutor legal.';

    if (!r.firma) return 'Firma en el recuadro para terminar.';
  }
  return '';
}

  root.querySelectorAll('[data-doc]').forEach(el => el.onchange = () => r.docs[el.dataset.doc] = el.checked);

  const back = root.querySelector('#r_back'); if (back) back.onclick = () => { r.step--; r.err = ''; render(); };

    if (r.step < 3){ r.step++; render(); window.scrollTo(0,0); return; }

}

function signModal(uid, docId){

  let firma = null;
  modal(`<h2>${d ? esc(d.title) : 'Tu firma'}</h2>
    ${d ? `<div class="summary" style="max-height:180px;overflow:auto;font-size:13.5px">${d.body}</div>` : '<p class="muted">Esta firma se usará en los documentos que firmes desde ahora.</p>'}

    <div class="err" id="m_err" role="alert"></div>
    <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="m_ok">${d ? (d.req ? 'Firmar documento' : 'Aceptar y firmar') : 'Guardar firma'}</button></div>`, m => {
    const cv = m.querySelector('#m_sig'), clear = mountSig(cv, v => { firma = v; cv.parentNode.classList.toggle('signed', !!v); });

}
function copyText(text, okMsg){
  const done = () => toast(okMsg);
  try { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, okMsg)); } catch(e){ fallbackCopy(text, okMsg); }
}
function fallbackCopy(text, okMsg){
  modal(`<h2>Copia los datos</h2><p class="muted">Selecciona el texto y cópialo.</p><textarea rows="10" readonly style="font-family:ui-monospace,monospace;font-size:12px">${esc(text)}</textarea><div class="actions"><button class="btn" data-close>Cerrar</button></div>`, m => { const t = m.querySelector('textarea'); t.focus(); t.select(); });
}

function bindFicha(root, uid, viewer){
  const c = S.clients[uid], adm = viewer === ADMIN;
  root.querySelector('#f_edit').onclick = () => editModal(uid);
  const ph = root.querySelector('#f_photo');
  ph.onchange = async () => {
    const f = ph.files[0]; if (!f) return;
    try { c.foto = await photoFrom(f); } catch(e){ return toast('No se ha podido leer la imagen. Prueba con otra foto.'); }
    save(); render(); toast('Foto guardada.');
  };
  const ap = root.querySelector('#f_addphoto'); if (ap) ap.onclick = () => ph.click();
  const np = root.querySelector('#f_nophoto'); if (np) np.onclick = () => { delete c.foto; save(); render(); toast('Foto quitada.'); };
  root.querySelectorAll('[data-sign]').forEach(b => b.onclick = () => signModal(uid, b.dataset.sign));
  root.querySelectorAll('[data-revoke]').forEach(b => b.onclick = () => { c.docs[b.dataset.revoke] = { ok:false, ts:Date.now(), v:c.docs[b.dataset.revoke].v, revoked:true }; save(); render(); toast('Consentimiento retirado.'); });
  const rs = root.querySelector('#f_resign'); if (rs) rs.onclick = () => signModal(uid, null);
  root.querySelector('#f_file').onchange = e => { [...e.target.files].forEach(f => c.archivos.push({ name:f.name, size:f.size, ts:Date.now() })); save(); render(); toast('Archivo adjuntado.'); };
  root.querySelector('#f_copy').onclick = () => copyText(exportClient(uid), adm ? 'Ficha copiada al portapapeles.' : 'Tus datos se han copiado al portapapeles.');
  const sup = root.querySelector('#f_sup');
  if (sup) sup.onclick = () => modal(`<h2>¿Solicitar que borren tus datos?</h2><p class="muted">Recepción recibirá tu solicitud y te responderá en el plazo legal de un mes. Se borrarán tus datos personales; las facturas se conservan el tiempo que exige la ley.</p>
    <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn accent" id="m_sup">Enviar solicitud</button></div>`, m => m.querySelector('#m_sup').onclick = () => {
      c.derechos.push({ tipo:'Supresión', ts:Date.now(), estado:'Pendiente' });
      notify(ADMIN, `${SOCIOS[uid]} ha solicitado la supresión de sus datos.`); sendMsg(uid, uid, 'He solicitado la supresión de mis datos desde Mi ficha.');
      closeLayer(); save(); render(); toast('Solicitud enviada a recepción.'); });
  if (!adm) return;
  root.querySelector('#f_credits').onclick = () => creditsModal(uid);
  const ask = root.querySelector('#f_ask');
  if (ask) ask.onclick = () => { sendMsg(uid, 'centro', `Hola, ${c.nombre}. Te falta completar en tu ficha: ${missing(c).join(', ')}. Puedes hacerlo y firmar desde la app, en «Mi ficha».`, { kind:'aviso', cat:'Documentación' }); notify(uid, 'Tienes documentos pendientes de firmar en Mi ficha.'); save(); toast(`Aviso enviado a ${SOCIOS[uid]}.`); };
  root.querySelector('#f_reg').onclick = () => { c.derechos.push({ tipo:root.querySelector('#f_right').value, ts:Date.now(), estado:'Registrada en recepción' }); save(); render(); toast('Solicitud registrada.'); };
  root.querySelector('#f_baja').onclick = () => modal(`<h2>¿Dar de baja y anonimizar?</h2><p class="muted">Se borran los datos personales, de salud, la firma y los archivos de ${esc(SOCIOS[uid])}, y se cancelan sus reservas. Los pagos se conservan sin nombre por obligación fiscal. No se puede deshacer.</p>
    <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn accent" id="m_baja">Dar de baja</button></div>`, m => m.querySelector('#m_baja').onclick = () => {
      if (LIVE) return liveBaja(uid, c);
      S.classes.forEach(x => { if (x.booked.includes(uid)){ x.booked = x.booked.filter(u => u !== uid); promote(x); } x.wait = x.wait.filter(u => u !== uid); });
      S.clients[uid] = { nombre:'Cliente', apellidos:'dado de baja', dni:'', nac:'', tel:'', email:'', dir:'', emerg:{nombre:'',tel:'',rel:''}, salud:{}, docs:{}, firma:null, archivos:[], tutor:null, alta:c.alta,
        baja:Date.now(), derechos:c.derechos.map(x => ({ ...x, estado:x.tipo === 'Supresión' ? 'Atendida' : x.estado })).concat({ tipo:'Baja y anonimización', ts:Date.now(), estado:'Atendida' }) };
      S.msgs = S.msgs.filter(x => x.thread !== uid); S.notifs = S.notifs.filter(x => x.uid !== uid);
      syncNames(S.clients); cliSel = null; closeLayer(); save(); render(); toast('Cliente dado de baja y datos anonimizados.'); });
}

    ${list.length ? `<div class="table-wrap"><table class="clients"><thead><tr><th>Cliente</th><th>Contacto</th><th>Alta</th><th class="r">Bono</th><th>Documentación</th></tr></thead><tbody>
      ${list.map(k => { const c = S.clients[k], m = missing(c); return `<tr data-cli="${k}" tabindex="0"><td><span style="display:flex;gap:10px;align-items:center">${avatar(c)}<span><b style="font-weight:500">${esc(c.nombre)} ${esc(c.apellidos)}</b>${hasHealth(c) ? ' <span class="tagreq req" title="Tiene datos de salud">Salud</span>' : ''}<br><small class="muted">${esc(c.dni)}</small></span></span></td><td>${esc(c.email)}<br><small class="muted">${esc(c.tel)}</small></td><td class="num muted">${fmtDate(c.alta)}</td><td class="r num">${S.credits[k] || 0}</td><td>${m.length ? `<span class="status wait">${m.length} ${m.length === 1 ? 'pendiente' : 'pendientes'}</span>` : '<span class="status ok">Completa</span>'}</td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="empty">${ISO()}<p>No hay clientes que coincidan.</p></div>`}`;

function afterClientes(root){
  if (reg && reg.byAdmin) return bindRegistro(root, uid => { cliSel = uid; render(); toast('Cliente dado de alta.'); });

  if (back){ back.onclick = () => { cliSel = null; render(); }; return bindFicha(root, cliSel, ADMIN); }
  root.querySelector('#c_new').onclick = () => { reg = newReg(true); render(); };
  const q = root.querySelector('#c_q');
  q.oninput = () => { cliQ = q.value; const pos = q.selectionStart; render(); const n = document.querySelector('#c_q'); n.focus(); n.setSelectionRange(pos, pos); };
  root.querySelectorAll('[data-cf]').forEach(b => b.onclick = () => { cliF = b.dataset.cf; render(); });
  root.querySelectorAll('[data-cli]').forEach(tr => { tr.onclick = () => { cliSel = tr.dataset.cli; render(); window.scrollTo(0,0); }; tr.onkeydown = e => { if (e.key === 'Enter') tr.onclick(); }; });
}

function afterFichajes(root){

    const days = workdays(ev); rows.push([], ['Resumen'], ['Persona','Día','Entrada','Salida','Pausas','Trabajado']);
    days.slice().reverse().forEach(w => rows.push([clkName(w.uid), w.day, w.start ? hm(w.start.at) : '', w.end ? hm(w.end.at) : '', dur(w.paused), dur(w.worked)]));
    const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(';')).join('\r\n')], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `fichajes-${CLK.month}.csv`; document.body.appendChild(a); a.click(); a.remove();
  };
  const add = root.querySelector('#ck_add');
  if (add) add.onclick = () => {

      <label class="field">Persona<select id="ka_u">${people.map(u => `<option value="${u}">${esc(clkName(u))}</option>`).join('')}</select></label>
      <div class="grid2"><label class="field">Tipo<select id="ka_k">${Object.entries(CLOCK_TXT).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></label>

      <label class="field">Motivo<input id="ka_n" placeholder="Olvidó fichar la salida"></label>
      <div class="err" id="ka_err" role="alert"></div>
      <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="ka_ok">Añadir</button></div>`, m => m.querySelector('#ka_ok').onclick = () => {

      if (LIVE) return liveOp(() => rpc('admin_clock_add', { p_uid:u, p_kind:k, p_at:t.toISOString(), p_note:n }), () => { CLK.key = ''; return 'Fichaje añadido.'; });
      (S.clock = S.clock || []).push({ id:'k' + Date.now(), uid:u, kind:k, at:+t, manual:true, note:n }); save(); render(); toast('Fichaje añadido.');

  bindLogout(root);

// ---------- equipo: ficha del trabajador y su carpeta de documentos ----------

const DOC_FOLDERS = [['contratos', 'Contratos'], ['nominas', 'Nóminas'], ['personal', 'Documentos personales']];

let EQ = { key:'', docs:{}, docsKey:'' };
function workerOf(k){

    const a = staffAccess(k); return a ? { ...a, worker:a.worker || {} } : null;
  }

}
function docsHTML(wk){

        <button type="button" class="linkbtn" data-dl="${f}/${esc(x.name)}">Descargar</button>${can ? `<button type="button" class="linkbtn" data-rm="${f}/${esc(x.name)}">Eliminar</button>` : ''}</li>`).join('')}</ul>` : ''}</div>`; }).join('');
}

async function loadDocs(wk){
  const out = {};
  try {
    for (const [f] of DOC_FOLDERS){
      const { data, error } = await sb.storage.from('equipo').list(`${SUPA.center}/${wk.id}/${f}`, { limit:200, sortBy:{ column:'created_at', order:'desc' } });
      if (error) throw error;
      out[f] = (data || []).filter(x => x.name && x.name !== '.emptyFolderPlaceholder').map(x => ({ name:x.name, label:x.name.replace(/^\d+-/, ''), date:x.created_at, size:x.metadata && x.metadata.size }));
    }
    EQ.docs[wk.id] = out;
  } catch(e){ EQ.docs[wk.id] = {}; toast('No se han podido cargar los documentos.'); }
  if (S.tab === 'equipo' && !isTyping()) render();
}

// ---------- control de acceso con código QR ----------
// El QR del socio cambia cada 30 s y lleva una firma, para que una captura de pantalla no sirva más tarde.
// En producción la firma la genera y la comprueba el servidor con una clave secreta.
const QR_STEP = 30000, QR_SECRET = 'alento-demo';
const qhash = str => { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
const accessToken = (uid, slot = Math.floor(Date.now() / QR_STEP)) => `ALT1.${uid}.${slot.toString(36)}.${qhash(uid + '.' + slot + '.' + QR_SECRET)}`;
function qrSvg(text){
  if (typeof qrcode !== 'function') return `<p class="muted" style="font-family:ui-monospace,monospace">${esc(text)}</p>`;
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg class="qr" viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="Código QR de acceso"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#3E4C38"/></svg>`;
}
// Clase de hoy que da acceso: desde 60 min antes del inicio hasta 15 min después
function accessClass(uid){
  const now = Date.now();
  return S.classes.filter(c => c.booked.includes(uid) && c.date === ymd(new Date()))
    .map(c => ({ c, diff:(at(c) - now) / 6e4 })).sort((a,b) => a.diff - b.diff);
}
function checkAccess(token){
  const m = /^ALT1\.([a-z0-9-]+)\.([a-z0-9]+)\.([a-z0-9]+)$/.exec((token || '').trim());
  if (!m) return { ok:false, level:'bad', title:'Código no válido', text:'No es un código de acceso de la app.' };
  const [, uid, slot36, sig] = m, slot = parseInt(slot36, 36), cur = Math.floor(Date.now() / QR_STEP);
  if (qhash(uid + '.' + slot + '.' + QR_SECRET) !== sig) return { ok:false, level:'bad', title:'Código no válido', text:'La firma del código no coincide.' };
  if (Math.abs(cur - slot) > 2) return { ok:false, level:'bad', title:'Código caducado', text:'Pide al cliente que abra de nuevo su código en la app.' };
  const c = S.clients[uid];
  if (!c || c.baja) return { ok:false, level:'bad', title:'Cliente no encontrado', text:'Este cliente no está dado de alta.' };
  const name = SOCIOS[uid], miss = missing(c);
  if (miss.length) return { ok:false, level:'warn', uid, title:`${name}: documentación pendiente`, text:`Falta: ${miss.join(', ')}. Puede firmarlo ahora desde «Mi ficha».` };
  const list = accessClass(uid), now = list.find(x => x.diff <= 60 && x.diff >= -15);
  if (now) return { ok:true, level:'ok', uid, cls:now.c.id, title:`Bienvenida, ${c.nombre}`, text:`${now.c.type} a las ${now.c.time} con ${INSTR[now.c.instr].name} · ${TYPES[now.c.type].room}` };
  const later = list.find(x => x.diff > 60);
  return { ok:false, level:'warn', uid, title:`${name}: sin ${SEC.unit} ahora`, text: later ? `Su ${SEC.unit} de hoy es a las ${later.c.time}. El acceso se abre 60 minutos antes.` : `No tiene ${SEC.units} reservadas para hoy. Le quedan ${S.credits[uid] || 0} en el bono.` };
}
function registerEntry(res, manual){
  S.accessLog.unshift({ ts:Date.now(), uid:res.uid || null, ok:res.ok || !!manual, title:res.title, manual:!!manual });
  S.accessLog = S.accessLog.slice(0, 60);
  if (res.cls){ const c = S.classes.find(x => x.id === res.cls); c.attended = [...new Set((c.attended || []).concat(res.uid))]; if (LIVE) L.attended.push({ cls:res.cls, uid:res.uid }); }
  save();
}

let qrTimer = null;
function openQR(){
  const uid = me(), c = S.clients[uid];
  const draw = () => {
    const box = document.querySelector('#qrBox'); if (!box){ clearInterval(qrTimer); return; }
    box.innerHTML = qrSvg(accessToken(uid));
    const left = Math.ceil((QR_STEP - Date.now() % QR_STEP) / 1000);
    document.querySelector('#qrLeft').textContent = left;
    document.querySelector('#qrBar').style.transform = `scaleX(${left / (QR_STEP/1000)})`;
  };
  const list = accessClass(uid), next = list.find(x => x.diff >= -15), miss = missing(c);
  modal(`<div class="qrsheet">
    <svg class="logo" viewBox="0 0 572 179" style="width:110px;color:var(--brand)" aria-label="Alento"><use href="#alento-logo"/></svg>
    ${c.foto ? avatar(c, 'lg') : ''}<h2 style="margin-top:10px">${esc(c.nombre)} ${esc(c.apellidos)}</h2>

    <div class="actions" style="justify-content:center"><button class="btn ghost" data-close>Cerrar</button></div></div>`);

function showResult(root, res){
  registerEntry(res);
  const box = root.querySelector('#scanResult');
  const who = res.uid && S.clients[res.uid];
  box.innerHTML = `<div class="result ${res.level}" role="status">${who && who.foto ? `<div class="who">${avatar(who)}<div><b>${esc(res.title)}</b><br><span>${esc(res.text)}</span></div></div>` : `<b>${esc(res.title)}</b><span>${esc(res.text)}</span>`}

  const al = box.querySelector('#allowIn'); if (al) al.onclick = () => { registerEntry({ ...res, title:`${SOCIOS[res.uid]}: entrada permitida por recepción` }, true); render(); toast('Entrada registrada.'); };

function afterAcceso(root){
  root.querySelectorAll('[data-sim]').forEach(b => b.onclick = () => { stopScan(); render(); showResult(document.querySelector('#view'), checkAccess(accessToken(b.dataset.sim))); });
  root.querySelector('#codeForm').onsubmit = e => { e.preventDefault(); showResult(root, checkAccess(root.querySelector('#codeIn').value)); };
  root.querySelectorAll('[data-in]').forEach(b => b.onclick = () => { const [cid, u] = b.dataset.in.split('|'); const c = S.classes.find(x => x.id === cid); registerEntry({ uid:u, ok:true, cls:cid, title:`${SOCIOS[u]} · ${c.type} ${c.time}` }, true); render(); toast('Entrada registrada.'); });
  const start = root.querySelector('#scanStart'), stop = root.querySelector('#scanStop');
  stop.onclick = () => { stopScan(); render(); };
  start.onclick = async () => {
    const res = root.querySelector('#scanResult');
    if (!('BarcodeDetector' in window) || !navigator.mediaDevices){ res.innerHTML = `<div class="result warn"><b>Este navegador no puede leer códigos con la cámara</b><span>Funciona en la app instalada en Android (Chrome). En iPhone, usa un lector USB o Bluetooth en el campo de código, o simula la lectura abajo.</span></div>`; return; }
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
      const v = root.querySelector('#scanVideo'); v.srcObject = scanStream; v.hidden = false; await v.play();
      root.querySelector('#scanIdle').hidden = true; start.hidden = true; stop.hidden = false;
      const det = new BarcodeDetector({ formats:['qr_code'] });
      const loop = async () => {
        if (!scanStream) return;
        try { const codes = await det.detect(v); if (codes.length){ const val = codes[0].rawValue; stopScan(); render(); showResult(document.querySelector('#view'), checkAccess(val)); return; } } catch(e){}
        requestAnimationFrame(loop);
      };
      loop();
    } catch(e){ res.innerHTML = `<div class="result warn"><b>No se ha podido abrir la cámara</b><span>Revisa el permiso de cámara del navegador, o usa el campo de código.</span></div>`; }
  };
}

  else if (!tabsFor().includes(S.tab)) S.tab = isAdmin() ? 'clientes' : isStaff() ? 'fichajes' : 'horario';
  renderHeader();
  const root = $('#view'), [v, after] = VIEWS[S.tab];
  root.innerHTML = v();
  bindActions(root); after(root);
}
const hash = location.hash.slice(1);
if (VIEWS[hash]) S.tab = hash;
if (hash === 'registro') accesoMode = 'registro';
if (LIVE) startLive(); else render();
})();
</script>

<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).catch(() => {}));</script>
